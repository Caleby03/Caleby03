# Refreshes the Arcanet website screenshot used in the README.
name: Screenshots

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main, claude/self-hosted-metrics]
    paths:
      - .github/workflows/screenshots.yml
      - .github/scripts/screenshot.mjs

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  arcanet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save --prefix .github/scripts playwright@1.47.2
          npx --prefix .github/scripts playwright install --with-deps chromium

      - name: Capture arcanettechnology.com
        run: node .github/scripts/screenshot.mjs https://arcanettechnology.com assets/screenshots/arcanet.jpg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/arcanet.jpg
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi
          git commit -m "chore: refresh arcanet screenshot [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
