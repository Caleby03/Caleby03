# Generates the README's GitHub analytics as SVGs committed to this repo.
# Uses only the built-in GITHUB_TOKEN: no personal access token is stored.
name: Metrics

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - .github/scripts/metrics.py

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/metrics.py Caleby03 assets/metrics

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics
          if git diff --cached --quiet; then
            echo "Metrics unchanged"
            exit 0
          fi
          git commit -m "chore: update metrics [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
